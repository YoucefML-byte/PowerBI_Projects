<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projets Power BI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #14171C;
    --panel: #1B1F26;
    --line: #2A2F38;
    --ink: #EDEDE8;
    --ink-dim: #9BA1AC;
    --accent: #D9A441;
    --accent-dim: #8A6A2E;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    line-height:1.5;
  }
  .wrap{
    max-width:880px;
    margin:0 auto;
    padding: 64px 24px 96px;
  }
  header{
    margin-bottom:56px;
    border-bottom:1px solid var(--line);
    padding-bottom:32px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:clamp(2.2rem, 5vw, 3.4rem);
    margin:0 0 12px;
    letter-spacing:-0.02em;
    color:var(--ink);
  }
  header p{
    color:var(--ink-dim);
    font-size:1.05rem;
    max-width:52ch;
    margin:0;
  }
  h1 span{color:var(--accent);}

  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:16px;
    margin-bottom:56px;
  }
  .card{
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    gap:24px;
    padding:24px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:4px;
    text-decoration:none;
    color:var(--ink);
    transition: border-color .15s ease, transform .15s ease;
    min-height:150px;
  }
  .card:hover, .card:focus-visible{
    border-color:var(--accent-dim);
    transform:translateY(-2px);
  }
  .card:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .card .meta{
    font-size:.78rem;
    color:var(--ink-dim);
    font-family:'Space Grotesk', sans-serif;
  }
  .card h2{
    font-family:'Space Grotesk', sans-serif;
    font-size:1.15rem;
    font-weight:600;
    margin:0;
    line-height:1.3;
  }
  .card .open{
    font-size:.85rem;
    color:var(--accent);
  }
  .card-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:12px;
  }
  .remove-btn{
    background:none;
    border:none;
    color:var(--ink-dim);
    font-size:.78rem;
    cursor:pointer;
    padding:4px;
    text-decoration:underline;
    text-underline-offset:2px;
  }
  .remove-btn:hover{ color:var(--ink); }

  .empty{
    color:var(--ink-dim);
    border:1px dashed var(--line);
    border-radius:4px;
    padding:32px;
    text-align:center;
    font-size:.95rem;
  }

  section.add{
    border-top:1px solid var(--line);
    padding-top:32px;
  }
  section.add h3{
    font-family:'Space Grotesk', sans-serif;
    font-size:1rem;
    font-weight:600;
    margin:0 0 16px;
    color:var(--ink-dim);
  }
  form{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
  }
  form input{
    flex:1 1 220px;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--ink);
    padding:12px 14px;
    border-radius:4px;
    font-family:'Inter', sans-serif;
    font-size:.9rem;
  }
  form input:focus{
    outline:none;
    border-color:var(--accent-dim);
  }
  form button{
    background:var(--accent);
    color:#14171C;
    border:none;
    padding:12px 22px;
    border-radius:4px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    flex:0 0 auto;
  }
  form button:hover{ background:#e8b654; }
  .hint{
    font-size:.78rem;
    color:var(--ink-dim);
    margin-top:10px;
  }
  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Projets <span>Power BI</span></h1>
    <p>Une sélection de mes tableaux de bord et rapports Power BI. Cliquez sur une carte pour ouvrir le rapport.</p>
  </header>

  <div class="grid" id="grid"></div>

  <section class="add">
    <h3>Ajouter un projet</h3>
    <form id="addForm">
      <input type="text" id="titleInput" placeholder="Titre du projet" required>
      <input type="url" id="urlInput" placeholder="Lien Power BI (https://...)" required>
      <button type="submit">Ajouter</button>
    </form>
    <p class="hint">Les projets ajoutés ici sont enregistrés dans ce navigateur uniquement.</p>
  </section>
</div>

<script>
  const STORAGE_KEY = 'powerbi_projects';
  const defaultProjects = [
    { title: "CA_de_ventes_et_pertes", url: "https://app.powerbi.com/groups/me/reports/c00f29f9-2903-44dc-baf1-96ab87d60817/12e019dc82e335045760?experience=power-bi" },
    { title: "Données démographique et météo du monde", url: "https://app.powerbi.com/groups/me/reports/65991729-a60f-4db4-be90-46768c4bfffc/2729e34bc7268dda571a?experience=power-bi" }
  ];

  function loadProjects(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){}
    saveProjects(defaultProjects);
    return defaultProjects;
  }

  function saveProjects(list){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
    }catch(e){}
  }

  function render(){
    const grid = document.getElementById('grid');
    const projects = loadProjects();
    grid.innerHTML = '';

    if(projects.length === 0){
      const div = document.createElement('div');
      div.className = 'empty';
      div.textContent = 'Aucun projet pour le moment. Ajoutez-en un ci-dessous.';
      grid.appendChild(div);
      return;
    }

    projects.forEach((p, i) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = p.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';

      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = 'RAPPORT POWER BI';

      const h2 = document.createElement('h2');
      h2.textContent = p.title;

      const row = document.createElement('div');
      row.className = 'card-row';

      const open = document.createElement('span');
      open.className = 'open';
      open.textContent = 'Ouvrir le rapport';

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = 'Retirer';
      removeBtn.type = 'button';
      removeBtn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const current = loadProjects();
        current.splice(i, 1);
        saveProjects(current);
        render();
      });

      row.appendChild(open);
      row.appendChild(removeBtn);

      card.appendChild(meta);
      card.appendChild(h2);
      card.appendChild(row);
      grid.appendChild(card);
    });
  }

  document.getElementById('addForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const titleInput = document.getElementById('titleInput');
    const urlInput = document.getElementById('urlInput');
    const title = titleInput.value.trim();
    const url = urlInput.value.trim();
    if(!title || !url) return;

    const current = loadProjects();
    current.push({ title, url });
    saveProjects(current);
    titleInput.value = '';
    urlInput.value = '';
    render();
  });

  render();
</script>
</body>
</html>
